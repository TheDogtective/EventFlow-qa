# Identite : cles relevees dans SonarQube Cloud > Information (attention au "2")
sonar.organization=michaelperson-1
sonar.projectKey=michaelperson_EventFlow_Cours2

# Corrige l'avertissement "sonar.python.version is not defined"
sonar.python.version=3.12

# On analyse tout le depot : Dockerfiles, docker-compose et workflows compris
sonar.sources=.
# Les tests sont declares a part (sinon : "rules targeting production code were not executed")
sonar.tests=qa/tests,qa/conftest.py
# Un fichier ne peut pas etre a la fois source et test : on retire les tests des sources
sonar.exclusions=qa/tests/**,qa/conftest.py,**/node_modules/**,qa/reports/**

# Rapports externes produits par le workflow (etape 5)
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.ruff.reportPaths=ruff-report.json

# Le job echoue si la quality gate est rouge
sonar.qualitygate.wait=true